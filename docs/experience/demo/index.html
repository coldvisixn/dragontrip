<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Dragontrip — полный путь</title><style>body{margin:0;padding:24px;background:#10141d;color:#eee;font:16px system-ui}main{max-width:1366px;margin:auto}img{width:100%;border:1px solid #444}button{padding:10px;margin:10px 8px 10px 0}p{min-height:3em}</style><main><h1>Dragontrip: от цели до ретеста и переноса проекта</h1><p>Пошаговая демонстрация реального интерфейса. Chromium + реальный backend. Сетевые проверки направлены только на собственный loopback-сервер.</p><img id="frame" alt=""><p id="caption" aria-live="polite"></p><button id="prev">Назад</button><button id="play">Воспроизвести</button><button id="next">Далее</button><span id="count"></span></main><script>const frames=[{"file":"01-plan.png","caption":"Цель проекта и следующий шаг находятся вместе."},{"file":"02-approval.png","caption":"Адрес перенесён из scope. Перед сетевым действием проверяется план и требуется разрешение."},{"file":"03-results.png","caption":"Завершение означает сохранённый результат. Технический вывод раскрывается отдельно."},{"file":"04-handoff.png","caption":"Выбранный сервис передан в веб-исследование. Этот переход не отправляет запросов."},{"file":"05-web.png","caption":"Ответ локального сервера, выбранный endpoint и ссылка на источник доступны в одном рабочем пространстве."},{"file":"06-source.png","caption":"Импорт продолжает то же исследование: доступны ответ, исходное наблюдение и оригинальный файл."},{"file":"07-task.png","caption":"Гипотеза превращается в связанную задачу. Результат проверки сохраняется вместе с происхождением."},{"file":"08-retest.png","caption":"Находка и повторная проверка сохраняют историю. Отсутствие результата не считается исправлением."},{"file":"09-resume.png","caption":"После перезапуска восстановлена находка и история ретеста. Новых сетевых действий нет."},{"file":"10-transfer.png","caption":"Архив v6 открыт как отдельный проект: цель, объекты, доказательства, задачи и ретест сохранены."}];let i=0,t;function show(){document.querySelector('#frame').src=frames[i].file;document.querySelector('#frame').alt=frames[i].caption;document.querySelector('#caption').textContent=frames[i].caption;document.querySelector('#count').textContent=(i+1)+' / '+frames.length}document.querySelector('#prev').onclick=()=>{i=(i+frames.length-1)%frames.length;show()};document.querySelector('#next').onclick=()=>{i=(i+1)%frames.length;show()};document.querySelector('#play').onclick=()=>{if(t){clearInterval(t);t=null}else t=setInterval(()=>{i=(i+1)%frames.length;show()},4500);document.querySelector('#play').textContent=t?'Пауза':'Воспроизвести'};show();</script></html>
