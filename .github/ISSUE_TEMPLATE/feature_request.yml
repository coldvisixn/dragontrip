name: Feature request
description: Suggest an improvement to an investigation workflow.
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: What task or problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain how the experience should work for the user.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround or alternatives
