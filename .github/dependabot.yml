version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # TypeScript 7 is outside typescript-eslint's supported peer range (<6.1).
    # Revisit major compiler upgrades together with the lint toolchain.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      frontend-build:
        patterns: [vite, '@vitejs/plugin-react', vitest]
      development-tools:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pydantic:
        patterns: [pydantic, pydantic-core, pydantic_core]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
