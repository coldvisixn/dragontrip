name: Dependency security audit
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Audit JavaScript lockfile, including development tools
        run: npm audit
      - name: Verify GTK source provenance and compatibility patch
        run: python scripts/check-vendored-gtk.py
      - name: Audit Python lockfile without installing application packages
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit --strict --disable-pip --no-deps -r backend/requirements-lock.txt

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.99.0'
      - name: Install pinned RustSec auditor
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Rust dependencies including backported registry baselines
        run: python3 scripts/audit-rust.py
