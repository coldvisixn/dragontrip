name: Linux build and verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  quick:
    name: Quick checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      native_required: ${{ steps.changes.outputs.native_required }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Determine whether desktop verification is needed
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 - <<'PYTHON'
          import os, subprocess
          base = os.environ.get('BASE_SHA', '')
          required = True
          if base and set(base) != {'0'}:
              changed = subprocess.check_output(
                  ['git', 'diff', '--name-only', '-z', base, os.environ['GITHUB_SHA']]
              ).decode().split('\0')
              def documentation(path):
                  return (path.startswith(('docs/', '.github/ISSUE_TEMPLATE/'))
                          or path in {'README.md', 'README.ru.md', 'CHANGELOG.md',
                                      'CONTRIBUTING.md', 'SECURITY.md', 'LICENSE',
                                      '.github/PULL_REQUEST_TEMPLATE.md'})
              required = any(path and not documentation(path) for path in changed)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('native_required=' + str(required).lower(), file=output)
          PYTHON
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: rustfmt
      - run: bash scripts/setup.sh
      - run: npm run check

  verify:
    needs: quick
    if: needs.quick.outputs.native_required == 'true'
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    outputs:
      package_built: ${{ steps.package.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve package version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "DRAGONTRIP_DEB=dragontrip_${version}_amd64.deb" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf nmap whatweb ffuf webkit2gtk-driver xvfb xauth dbus-x11 scrot xdotool
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.9'
          cache: false
      - uses: actions/cache/restore@v4
        id: httpx-cache
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/go/bin/httpx
          key: ${{ runner.os }}-${{ runner.arch }}-go1.24.9-httpx1.7.1
      - name: Install ProjectDiscovery httpx for recon acceptance
        run: |
          go install github.com/projectdiscovery/httpx/cmd/httpx@v1.7.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/save@v4
        if: steps.httpx-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/go/bin/httpx
          key: ${{ runner.os }}-${{ runner.arch }}-go1.24.9-httpx1.7.1
      - run: bash scripts/setup.sh
      - name: Live Nmap integration test
        run: |
          set -o pipefail
          .venv/bin/python -m pytest tests/test_nmap_live.py -q 2>&1 | tee backend-check.log || {
            message="$(tail -n 85 backend-check.log)"
            message="${message//'%'/'%25'}"
            message="${message//$'\n'/'%0A'}"
            message="${message//$'\r'/'%0D'}"
            echo "::error::$message"
            exit 1
          }
        env:
          DRAGONTRIP_LIVE_TEST: '1'
      - name: Package desktop
        id: package
        run: |
          source .venv/bin/activate
          npm run desktop:build
          rm -f docs/native-profile.json docs/screenshots/native-graph.png docs/screenshots/native-recon.png
      - run: .venv/bin/python scripts/smoke-packaged.py
      - name: Investigation workspace browser acceptance
        run: |
          node node_modules/playwright-core/cli.js install --with-deps chromium
          npm run dev > /tmp/dragontrip-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:1420/ > /dev/null; then break; fi
            sleep 0.2
          done
          CHROMIUM_PATH="$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")" \
            DRAGONTRIP_TEST_BACKEND=backend/dist/dragontrip-backend/dragontrip-backend \
            node scripts/workspace-smoke.cjs
          CHROMIUM_PATH="$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")" \
            DRAGONTRIP_TEST_BACKEND=backend/dist/dragontrip-backend/dragontrip-backend \
            node scripts/planning-smoke.cjs
          CHROMIUM_PATH="$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")" \
            DRAGONTRIP_TEST_BACKEND=backend/dist/dragontrip-backend/dragontrip-backend \
            node scripts/research-smoke.cjs
          CHROMIUM_PATH="$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")" \
            DRAGONTRIP_TEST_BACKEND=backend/dist/dragontrip-backend/dragontrip-backend \
            node scripts/navigation-smoke.cjs
          CHROMIUM_PATH="$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")" \
            DRAGONTRIP_TEST_BACKEND=backend/dist/dragontrip-backend/dragontrip-backend \
            node scripts/methodology-smoke.cjs
          CHROMIUM_PATH="$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")" \
            PROFILE_OUTPUT=docs/product-browser-profile.json node scripts/profile-graph.cjs
      - name: Prepare native test driver
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: System WhatWeb runtime diagnostic
        run: |
          {
            command -v ruby
            head -n 1 /usr/bin/whatweb
            /usr/bin/ruby --version
            timeout 12s whatweb --version < /dev/null || true
            timeout 12s /usr/bin/ruby /usr/bin/whatweb --version < /dev/null || true
          } > whatweb-runtime.log 2>&1
          message="$(tail -n 20 whatweb-runtime.log)"
          message="${message//'%'/'%25'}"
          message="${message//$'\n'/'%0A'}"
          message="${message//$'\r'/'%0D'}"
          echo "::notice::$message"
      - name: Real recon tools and scope acceptance
        run: |
          set -o pipefail
          .venv/bin/python scripts/recon-smoke.py 2>&1 | tee recon-check.log || {
            message="$(tail -n 45 recon-check.log)"
            message="${message//'%'/'%25'}"
            message="${message//$'\n'/'%0A'}"
            message="${message//$'\r'/'%0D'}"
            echo "::error::$message"
            exit 1
          }
      - name: Native packaged application test
        id: native
        run: |
          dpkg-deb -x "src-tauri/target/release/bundle/deb/$DRAGONTRIP_DEB" "$RUNNER_TEMP/dragontrip-native"
          set -o pipefail
          xvfb-run -a dbus-run-session -- .venv/bin/python scripts/native-smoke.py "$RUNNER_TEMP/dragontrip-native/usr/bin/dragontrip" --profile 2>&1 | tee native-check.log
      - name: Native research workspace acceptance
        run: xvfb-run -a dbus-run-session -- .venv/bin/python scripts/native-research-smoke.py "$RUNNER_TEMP/dragontrip-native/usr/bin/dragontrip"
      - name: Native methodology and workflow acceptance
        run: xvfb-run -a dbus-run-session -- .venv/bin/python scripts/native-methodology-smoke.py "$RUNNER_TEMP/dragontrip-native/usr/bin/dragontrip"
      - name: Native grouped navigation acceptance
        run: xvfb-run -a dbus-run-session -- .venv/bin/python scripts/native-navigation-smoke.py "$RUNNER_TEMP/dragontrip-native/usr/bin/dragontrip"
      - name: Native failure diagnostics
        if: failure() && steps.native.outcome == 'failure'
        run: |
          {
            echo '### Native validation diagnostics'
            echo '```text'
            tail -n 100 native-check.log 2>/dev/null || true
            tail -n 100 /tmp/dragontrip-native-driver.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          message="$(tail -n 60 native-check.log 2>/dev/null; tail -n 15 /tmp/dragontrip-native-driver.log 2>/dev/null || true)"
          message="${message//'%'/'%25'}"
          message="${message//$'\n'/'%0A'}"
          message="${message//$'\r'/'%0D'}"
          echo "::error::$message"
      - uses: actions/upload-artifact@v4
        if: always() && steps.package.outcome == 'success'
        with:
          name: native-test-driver
          path: ~/.cargo/bin/tauri-driver
      - uses: actions/upload-artifact@v4
        if: always() && steps.package.outcome == 'success'
        with:
          name: dragontrip-linux-amd64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sha256
            docs/native-profile.json
            docs/product-browser-profile.json
            docs/screenshots/native-graph.png
            docs/screenshots/native-recon.png
            docs/screenshots/native-appearance.png

  kali-preflight:
    needs: quick
    if: needs.quick.outputs.native_required == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    container:
      image: kalilinux/kali-rolling@sha256:02f5d6c019e549b0f55da58e835cad5355ef1030c6b2645265a324e37dfc4acc
      options: --volume /etc/ssl/certs/ca-certificates.crt:/run/bootstrap-ca.crt:ro
    steps:
      - name: Check official Kali repository before native acceptance
        shell: bash
        run: |
          sed -i 's|http://http.kali.org/kali|https://http.kali.org/kali|g' /etc/apt/sources.list.d/kali.sources
          printf 'Acquire::https::CaInfo "/run/bootstrap-ca.crt";\n' > /etc/apt/apt.conf.d/99bootstrap-ca
          if ! {
            apt-get update --error-on=any &&
            apt-get install --simulate -y --no-install-recommends ca-certificates git nmap whatweb httpx-toolkit ffuf webkitgtk-webdriver xvfb xauth dbus-x11 python3 desktop-file-utils libgtk-3-bin xdotool wmctrl xfwm4 x11-utils at-spi2-core scrot python3-pil
          } > /tmp/kali-repository.log 2>&1; then
            tail -n 40 /tmp/kali-repository.log
            message="$(tail -n 30 /tmp/kali-repository.log)"
            message="${message//'%'/'%25'}"
            message="${message//$'\n'/'%0A'}"
            message="${message//$'\r'/'%0D'}"
            echo "::error::$message"
            exit 1
          fi
          cat /tmp/kali-repository.log

  kali-installed:
    timeout-minutes: 20
    needs: [verify, kali-preflight]
    if: ${{ always() && needs.verify.outputs.package_built == 'true' && needs['kali-preflight'].result == 'success' }}
    runs-on: ubuntu-24.04
    container:
      image: kalilinux/kali-rolling@sha256:02f5d6c019e549b0f55da58e835cad5355ef1030c6b2645265a324e37dfc4acc
      # Stock Kali Nmap carries file capabilities including NET_ADMIN.
      # Permit its exec inside this container's private network namespace.
      options: --memory=4g --cpus=2 --shm-size=256m --cap-add=NET_ADMIN --volume /etc/ssl/certs/ca-certificates.crt:/run/bootstrap-ca.crt:ro
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Kali test dependencies
        run: |
          set -o pipefail
          # Use the official TLS endpoint rather than an HTTP mirror redirect.
          sed -i 's|http://http.kali.org/kali|https://http.kali.org/kali|g' /etc/apt/sources.list.d/kali.sources
          # Minimal Kali omits CA certificates; trust the runner's public roots for bootstrap.
          printf 'Acquire::https::CaInfo "/run/bootstrap-ca.crt";\n' > /etc/apt/apt.conf.d/99bootstrap-ca
          {
            apt-get update --error-on=any
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git nmap whatweb httpx-toolkit ffuf webkitgtk-webdriver xvfb xauth dbus-x11 python3 desktop-file-utils libgtk-3-bin xdotool wmctrl xfwm4 x11-utils at-spi2-core scrot python3-pil
          } 2>&1 | tee /tmp/kali-dependencies.log || {
            message="$(tail -n 25 /tmp/kali-dependencies.log)"
            message="${message//'%'/'%25'}"
            message="${message//$'\n'/'%0A'}"
            message="${message//$'\r'/'%0D'}"
            echo "::error::$message"
            exit 1
          }
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dragontrip-linux-amd64
          path: artifact
      - uses: actions/download-artifact@v4
        with:
          name: native-test-driver
          path: test-driver
      - name: Install actual Debian package on Kali
        run: |
          mapfile -t packages < <(find artifact -type f -name 'dragontrip_*_amd64.deb')
          test "${#packages[@]}" -eq 1
          DEBIAN_FRONTEND=noninteractive apt-get install -y "./${packages[0]}"
          dpkg-query -W dragontrip
          nmap --version
          chmod +x test-driver/tauri-driver
      - name: Installed Kali real recon tools and scope acceptance
        run: |
          set -o pipefail
          python3 scripts/recon-smoke.py --backend /usr/lib/Dragontrip/backend/dragontrip-backend 2>&1 | tee kali-recon-check.log || {
            message="$(tail -n 45 kali-recon-check.log)"
            message="${message//'%'/'%25'}"
            message="${message//$'\n'/'%0A'}"
            message="${message//$'\r'/'%0D'}"
            echo "::error::$message"
            exit 1
          }
      - name: Installed launcher, native acceptance and resource profile
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
          GSETTINGS_BACKEND: memory
        run: |
          set -o pipefail
          xvfb-run -a dbus-run-session -- bash scripts/installed-smoke.sh "$GITHUB_WORKSPACE/test-driver/tauri-driver" 2>&1 | tee kali-native-check.log || {
            message="$(tail -n 45 kali-native-check.log; tail -n 15 /tmp/dragontrip-native-driver.log 2>/dev/null || true)"
            message="${message//'%'/'%25'}"
            message="${message//$'\n'/'%0A'}"
            message="${message//$'\r'/'%0D'}"
            echo "::error::$message"
            exit 1
          }
      - name: Kali validation summary
        if: always()
        run: |
          {
            echo '### Installed Kali validation'
            echo '```text'
            tail -n 80 /tmp/kali-dependencies.log 2>/dev/null || true
            tail -n 60 kali-recon-check.log 2>/dev/null || true
            tail -n 100 kali-native-check.log 2>/dev/null || true
            tail -n 80 /tmp/dragontrip-native-driver.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Uninstall retains user data
        run: |
          mkdir -p "$HOME/.local/share/dragontrip"
          printf 'Package retention test\n' > "$HOME/.local/share/dragontrip/uninstall-check"
          apt-get remove -y dragontrip
          test -f "$HOME/.local/share/dragontrip/uninstall-check"
          test ! -e /usr/bin/dragontrip
      - uses: actions/upload-artifact@v4
        with:
          name: kali-native-validation
          path: |
            docs/native-profile.json
            docs/screenshots/native-graph.png
            docs/screenshots/native-recon.png

  ci:
    name: CI checks
    if: always()
    needs: [quick, verify, kali-preflight, kali-installed]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all applicable checks to pass
        env:
          QUICK_RESULT: ${{ needs.quick.result }}
          NATIVE_REQUIRED: ${{ needs.quick.outputs.native_required }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          PREFLIGHT_RESULT: ${{ needs['kali-preflight'].result }}
          INSTALLED_RESULT: ${{ needs['kali-installed'].result }}
        run: |
          test "$QUICK_RESULT" = success
          if [[ "$NATIVE_REQUIRED" == true ]]; then
            test "$VERIFY_RESULT" = success
            test "$PREFLIGHT_RESULT" = success
            test "$INSTALLED_RESULT" = success
          fi
