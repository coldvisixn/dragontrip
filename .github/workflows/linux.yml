name: Linux build and verification
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: rustfmt
      - name: Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf nmap webkit2gtk-driver xvfb xauth dbus-x11
      - run: bash scripts/setup.sh
      - run: .venv/bin/python -m pytest -q
        env:
          DRAGONTRIP_LIVE_TEST: '1'
      - run: npm test
      - run: npm run build
      - name: Package desktop
        run: |
          source .venv/bin/activate
          npm run desktop:build
      - run: .venv/bin/python scripts/smoke-packaged.py
      - name: Native packaged application test
        run: |
          cargo install tauri-driver --locked
          dpkg-deb -x src-tauri/target/release/bundle/deb/dragontrip_0.1.0_amd64.deb "$RUNNER_TEMP/dragontrip-native"
          xvfb-run -a dbus-run-session -- .venv/bin/python scripts/native-smoke.py "$RUNNER_TEMP/dragontrip-native/usr/bin/dragontrip" --profile
      - uses: actions/upload-artifact@v4
        with:
          name: dragontrip-linux-amd64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.sha256
            docs/native-profile.json
            docs/screenshots/native-graph.png
