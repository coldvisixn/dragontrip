name: Publish Linux release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Validate tag, version metadata and release notes
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, re, tomllib
          from pathlib import Path
          version = json.loads(Path('package.json').read_text())['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', version), version
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must match package.json'
          assert json.loads(Path('package-lock.json').read_text())['version'] == version
          assert json.loads(Path('src-tauri/tauri.conf.json').read_text())['version'] == version
          assert tomllib.loads(Path('src-tauri/Cargo.toml').read_text())['package']['version'] == version
          assert Path('docs/releases/' + os.environ['RELEASE_TAG'] + '.md').is_file(), 'Add release notes before tagging'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('version=' + version, file=output)
          PY
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Install Linux build and native-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf nmap whatweb webkit2gtk-driver xvfb xauth dbus-x11 scrot xdotool xfwm4 wmctrl
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.9'
          cache: false
      - name: Install ProjectDiscovery httpx for native workflow acceptance
        run: |
          go install github.com/projectdiscovery/httpx/cmd/httpx@v1.7.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: bash scripts/setup.sh
      - name: Lint, formatting, backend and UI checks
        env:
          DRAGONTRIP_LIVE_TEST: '1'
        run: npm run check
      - name: Build desktop installer
        run: |
          source .venv/bin/activate
          npm run desktop:build
          python scripts/smoke-packaged.py
      - name: Verify GTK safety backport with optimization enabled
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml --test gtk_security
      - name: Verify upgrade from published 0.8.0
        run: |
          directory="$RUNNER_TEMP/dragontrip-upgrade"
          mkdir -p "$directory"
          curl --fail --location --retry 3 https://github.com/coldvisixn/dragontrip/releases/download/v0.8.0/dragontrip_0.8.0_amd64.deb -o "$directory/dragontrip_0.8.0_amd64.deb"
          echo "303c219e6bf913b53a0243cc6bab26285beca3fba71e9115b29604cb637cae40  $directory/dragontrip_0.8.0_amd64.deb" | sha256sum --check
          dpkg-deb --extract "$directory/dragontrip_0.8.0_amd64.deb" "$directory/extracted"
          .venv/bin/python scripts/upgrade-smoke.py "$directory/extracted/usr/lib/Dragontrip/backend/dragontrip-backend"
      - name: Verify investigation recovery with frozen backend
        run: |
          node node_modules/playwright-core/cli.js install --with-deps chromium
          npx vite preview --config frontend/vite.config.ts --host 127.0.0.1 --port 1420 > /tmp/dragontrip-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:1420/ > /dev/null; then break; fi
            sleep 0.2
          done
          CHROMIUM_PATH="$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")" \
            DRAGONTRIP_TEST_BACKEND=backend/dist/dragontrip-backend/dragontrip-backend \
            node scripts/investigation-smoke.cjs
      - name: Verify package metadata and checksum
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          package="dragontrip_${PACKAGE_VERSION}_amd64.deb"
          directory=src-tauri/target/release/bundle/deb
          test "$(dpkg-deb --field "$directory/$package" Version)" = "$PACKAGE_VERSION"
          test "$(dpkg-deb --field "$directory/$package" Architecture)" = amd64
          (cd "$directory" && sha256sum --check "$package.sha256")
          dpkg-deb --extract "$directory/$package" "$RUNNER_TEMP/dragontrip-native"
      - name: Install native test driver
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Test packaged planning and reporting in WebKit
        env:
          GSETTINGS_BACKEND: memory
          DRAGONTRIP_VALIDATION_DIR: ${{ runner.temp }}/release-validation
        run: |
          xvfb-run -a dbus-run-session -- .venv/bin/python scripts/native-planning-smoke.py "$RUNNER_TEMP/dragontrip-native/usr/bin/dragontrip"
      - name: Test packaged research workspace in WebKit
        env:
          GSETTINGS_BACKEND: memory
          DRAGONTRIP_VALIDATION_DIR: ${{ runner.temp }}/release-validation
        run: xvfb-run -a dbus-run-session -- .venv/bin/python scripts/native-research-smoke.py "$RUNNER_TEMP/dragontrip-native/usr/bin/dragontrip"
      - name: Test packaged methodologies and workflows in WebKit
        env:
          GSETTINGS_BACKEND: memory
          DRAGONTRIP_VALIDATION_DIR: ${{ runner.temp }}/release-validation
        run: xvfb-run -a dbus-run-session -- .venv/bin/python scripts/native-methodology-smoke.py "$RUNNER_TEMP/dragontrip-native/usr/bin/dragontrip"
      - name: Test grouped navigation in WebKit
        env:
          GSETTINGS_BACKEND: memory
          DRAGONTRIP_VALIDATION_DIR: ${{ runner.temp }}/release-validation
        run: xvfb-run -a dbus-run-session -- .venv/bin/python scripts/native-navigation-smoke.py "$RUNNER_TEMP/dragontrip-native/usr/bin/dragontrip"
      - name: Test draft recovery and report bundles in WebKit
        env:
          GSETTINGS_BACKEND: memory
          DRAGONTRIP_VALIDATION_DIR: ${{ runner.temp }}/release-validation
        run: xvfb-run -a dbus-run-session -- .venv/bin/python scripts/native-delivery-smoke.py "$RUNNER_TEMP/dragontrip-native/usr/bin/dragontrip"
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-amd64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sha256
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-native-validation
          if-no-files-found: ignore
          path: ${{ runner.temp }}/release-validation

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-linux-amd64
          path: release-assets
      - name: Publish verified installer and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          package="dragontrip_${version}_amd64.deb"
          (cd release-assets && sha256sum --check "$package.sha256")
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release already exists; refusing to replace published assets."
            exit 1
          fi
          flags=()
          if [[ "$version" == 0.* || "$version" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "Dragontrip $version" \
            --notes-file "docs/releases/$RELEASE_TAG.md" \
            "${flags[@]}" \
            "release-assets/$package" \
            "release-assets/$package.sha256"
