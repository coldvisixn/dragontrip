name: Publish Linux release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate tag, version metadata and release notes
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, re, tomllib
          from pathlib import Path
          version = json.loads(Path('package.json').read_text())['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', version), version
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must match package.json'
          assert json.loads(Path('package-lock.json').read_text())['version'] == version
          assert json.loads(Path('package-lock.json').read_text())['packages']['']['version'] == version
          assert json.loads(Path('src-tauri/tauri.conf.json').read_text())['version'] == version
          assert tomllib.loads(Path('src-tauri/Cargo.toml').read_text())['package']['version'] == version
          assert next(p['version'] for p in tomllib.loads(Path('src-tauri/Cargo.lock').read_text())['package'] if p['name'] == 'dragontrip') == version
          assert Path('docs/releases/' + os.environ['RELEASE_TAG'] + '.md').is_file(), 'Add release notes before tagging'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('version=' + version, file=output)
          PY
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Install Linux build and native-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf nmap whatweb webkit2gtk-driver xvfb xauth dbus-x11 scrot xdotool xfwm4 wmctrl
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.24.9'
          cache: false
      - name: Install ProjectDiscovery httpx for native workflow acceptance
        run: |
          go install github.com/projectdiscovery/httpx/cmd/httpx@v1.7.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: bash scripts/setup.sh
      - name: Lint, formatting, backend and UI checks
        env:
          DRAGONTRIP_LIVE_TEST: '1'
        run: npm run check
      - name: Build desktop installer
        run: |
          source .venv/bin/activate
          npm run desktop:build
          python scripts/smoke-packaged.py
      - name: Verify GTK safety backport with optimization enabled
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml --test gtk_security
      - name: Verify data and encrypted vault upgrades from published releases
        run: |
          for baseline in 0.8.0 0.9.0; do
            case "$baseline" in
              0.8.0) digest=303c219e6bf913b53a0243cc6bab26285beca3fba71e9115b29604cb637cae40 ;;
              0.9.0) digest=0d980e3bb83350b638924f14b2a3f6242582e6b35a4fdf23053d9b88cef2810e ;;
            esac
            directory="$RUNNER_TEMP/dragontrip-upgrade/$baseline"
            mkdir -p "$directory"
            package="dragontrip_${baseline}_amd64.deb"
            curl --fail --location --retry 3 "https://github.com/coldvisixn/dragontrip/releases/download/v$baseline/$package" -o "$directory/$package"
            echo "$digest  $directory/$package" | sha256sum --check
            dpkg-deb --extract "$directory/$package" "$directory/extracted"
            .venv/bin/python scripts/upgrade-smoke.py "$directory/extracted/usr/lib/Dragontrip/backend/dragontrip-backend" --baseline-version "$baseline"
          done
      - name: Verify investigation recovery with frozen backend
        run: |
          node node_modules/playwright-core/cli.js install --with-deps chromium
          npx vite preview --config frontend/vite.config.ts --host 127.0.0.1 --port 1420 > /tmp/dragontrip-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:1420/ > /dev/null; then break; fi
            sleep 0.2
          done
          CHROMIUM_PATH="$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")" \
            DRAGONTRIP_TEST_BACKEND=backend/dist/dragontrip-backend/dragontrip-backend \
            node scripts/investigation-smoke.cjs
      - name: Verify package metadata and checksum
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          package="dragontrip_${PACKAGE_VERSION}_amd64.deb"
          directory=src-tauri/target/release/bundle/deb
          test "$(dpkg-deb --field "$directory/$package" Version)" = "$PACKAGE_VERSION"
          test "$(dpkg-deb --field "$directory/$package" Architecture)" = amd64
          (cd "$directory" && sha256sum --check "$package.sha256")
          dpkg-deb --extract "$directory/$package" "$RUNNER_TEMP/dragontrip-native"
      - name: Install native test driver
        run: cargo install tauri-driver --version 2.1.0 --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-native-test-driver
          path: ~/.cargo/bin/tauri-driver
      - name: Test packaged planning and reporting in WebKit
        env:
          GSETTINGS_BACKEND: memory
          DRAGONTRIP_VALIDATION_DIR: ${{ runner.temp }}/release-validation
        run: |
          xvfb-run -a dbus-run-session -- .venv/bin/python scripts/native-planning-smoke.py "$RUNNER_TEMP/dragontrip-native/usr/bin/dragontrip"
      - name: Test packaged research workspace in WebKit
        env:
          GSETTINGS_BACKEND: memory
          DRAGONTRIP_VALIDATION_DIR: ${{ runner.temp }}/release-validation
        run: xvfb-run -a dbus-run-session -- .venv/bin/python scripts/native-research-smoke.py "$RUNNER_TEMP/dragontrip-native/usr/bin/dragontrip"
      - name: Test packaged methodologies and workflows in WebKit
        env:
          GSETTINGS_BACKEND: memory
          DRAGONTRIP_VALIDATION_DIR: ${{ runner.temp }}/release-validation
        run: xvfb-run -a dbus-run-session -- .venv/bin/python scripts/native-methodology-smoke.py "$RUNNER_TEMP/dragontrip-native/usr/bin/dragontrip"
      - name: Test grouped navigation in WebKit
        env:
          GSETTINGS_BACKEND: memory
          DRAGONTRIP_VALIDATION_DIR: ${{ runner.temp }}/release-validation
        run: xvfb-run -a dbus-run-session -- .venv/bin/python scripts/native-navigation-smoke.py "$RUNNER_TEMP/dragontrip-native/usr/bin/dragontrip"
      - name: Test draft recovery and report bundles in WebKit
        env:
          GSETTINGS_BACKEND: memory
          DRAGONTRIP_VALIDATION_DIR: ${{ runner.temp }}/release-validation
        run: xvfb-run -a dbus-run-session -- .venv/bin/python scripts/native-delivery-smoke.py "$RUNNER_TEMP/dragontrip-native/usr/bin/dragontrip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-linux-amd64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: release-native-validation
          if-no-files-found: ignore
          path: ${{ runner.temp }}/release-validation

  kali-installed:
    timeout-minutes: 20
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: kalilinux/kali-rolling@sha256:02f5d6c019e549b0f55da58e835cad5355ef1030c6b2645265a324e37dfc4acc
      # Stock Kali Nmap carries file capabilities including NET_ADMIN.
      # Permit its exec inside this container's private network namespace.
      options: --memory=4g --cpus=2 --shm-size=256m --cap-add=NET_ADMIN --volume /etc/ssl/certs/ca-certificates.crt:/run/bootstrap-ca.crt:ro
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Kali test dependencies
        run: |
          set -o pipefail
          # Use the official TLS endpoint rather than an HTTP mirror redirect.
          sed -i 's|http://http.kali.org/kali|https://http.kali.org/kali|g' /etc/apt/sources.list.d/kali.sources
          # Minimal Kali omits CA certificates; trust the runner's public roots for bootstrap.
          printf 'Acquire::https::CaInfo "/run/bootstrap-ca.crt";\n' > /etc/apt/apt.conf.d/99bootstrap-ca
          {
            apt-get update --error-on=any
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git nmap whatweb httpx-toolkit ffuf webkitgtk-webdriver xvfb xauth dbus-x11 python3 desktop-file-utils libgtk-3-bin xdotool wmctrl xfwm4 x11-utils at-spi2-core scrot python3-pil
          } 2>&1 | tee /tmp/kali-dependencies.log || {
            message="$(tail -n 25 /tmp/kali-dependencies.log)"
            message="${message//'%'/'%25'}"
            message="${message//$'\n'/'%0A'}"
            message="${message//$'\r'/'%0D'}"
            echo "::error::$message"
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-linux-amd64
          path: artifact
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-native-test-driver
          path: test-driver
      - name: Install actual Debian package on Kali
        run: |
          mapfile -t packages < <(find artifact -type f -name 'dragontrip_*_amd64.deb')
          test "${#packages[@]}" -eq 1
          DEBIAN_FRONTEND=noninteractive apt-get install -y "./${packages[0]}"
          dpkg-query -W dragontrip
          nmap --version
          chmod +x test-driver/tauri-driver
      - name: Installed Kali real recon tools and scope acceptance
        run: |
          set -o pipefail
          python3 scripts/recon-smoke.py --backend /usr/lib/Dragontrip/backend/dragontrip-backend 2>&1 | tee kali-recon-check.log || {
            message="$(tail -n 45 kali-recon-check.log)"
            message="${message//'%'/'%25'}"
            message="${message//$'\n'/'%0A'}"
            message="${message//$'\r'/'%0D'}"
            echo "::error::$message"
            exit 1
          }
      - name: Installed launcher, native acceptance and resource profile
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
          GSETTINGS_BACKEND: memory
        run: |
          set -o pipefail
          xvfb-run -a dbus-run-session -- bash scripts/installed-smoke.sh "$GITHUB_WORKSPACE/test-driver/tauri-driver" 2>&1 | tee kali-native-check.log || {
            message="$(tail -n 45 kali-native-check.log; tail -n 15 /tmp/dragontrip-native-driver.log 2>/dev/null || true)"
            message="${message//'%'/'%25'}"
            message="${message//$'\n'/'%0A'}"
            message="${message//$'\r'/'%0D'}"
            echo "::error::$message"
            exit 1
          }
      - name: Kali validation summary
        if: always()
        run: |
          {
            echo '### Installed Kali validation'
            echo '```text'
            tail -n 80 /tmp/kali-dependencies.log 2>/dev/null || true
            tail -n 60 kali-recon-check.log 2>/dev/null || true
            tail -n 100 kali-native-check.log 2>/dev/null || true
            tail -n 80 /tmp/dragontrip-native-driver.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Uninstall retains user data
        run: |
          mkdir -p "$HOME/.local/share/dragontrip"
          printf 'Package retention test\n' > "$HOME/.local/share/dragontrip/uninstall-check"
          apt-get remove -y dragontrip
          test -f "$HOME/.local/share/dragontrip/uninstall-check"
          test ! -e /usr/bin/dragontrip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-kali-native-validation
          path: |
            docs/native-profile.json
            docs/screenshots/native-graph.png
            docs/screenshots/native-recon.png

  publish:
    needs: [build, kali-installed]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-linux-amd64
          path: release-assets
      - name: Publish verified installer and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          package="dragontrip_${version}_amd64.deb"
          (cd release-assets && sha256sum --check "$package.sha256")
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release already exists; refusing to replace published assets."
            exit 1
          fi
          flags=()
          if [[ "$version" == 0.* || "$version" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "Dragontrip $version" \
            --notes-file "docs/releases/$RELEASE_TAG.md" \
            "${flags[@]}" \
            "release-assets/$package" \
            "release-assets/$package.sha256"
