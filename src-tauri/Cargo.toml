[package]
name = "dragontrip"
version = "0.8.0"
edition = "2021"
description = "Local pentest workspace: from recon to report"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
getrandom = "0.2"
libc = "0.2"
tempfile = "3"
