[package]
name = "dragontrip"
version = "0.11.0"
edition = "2021"
description = "Local pentest workspace: from recon to report"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
getrandom = "0.4.3"
libc = "0.2"
tempfile = "3"

# Compatibility backports for GTK 3; provenance and exact patch are in vendor/.
[patch.crates-io]
glib = { path = "vendor/glib" }

[dev-dependencies]
glib = "0.18.5"
