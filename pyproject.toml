[tool.ruff]
target-version = "py312"
extend-exclude = ["backend/build", "backend/dist", "src-tauri", ".build-tools"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Put the checkout's backend on sys.path before importing it.
"tests/conftest.py" = ["E402"]
"scripts/launcher-smoke.py" = ["E402"]
